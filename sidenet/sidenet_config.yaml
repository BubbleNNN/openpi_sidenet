# ---------------------------------------------------------
# SideNet v2 config — perceiver-based architecture
# ---------------------------------------------------------

# Physics-token embedding dimension.
d_embedding: 512

# Hidden dimension used by Perceiver latents and SideNet readout.
d_sidenet: 512

# Number of fixed output tokens per modality branch.
num_encoding_tokens: 8

# Number of latent refinement blocks in each perceiver branch.
num_perceiver_layers: 1

# Number of injection tokens per injected layer in the text-conditioned
# fixed-length readout stage.
num_injection_tokens: 8

# Attention head count for all attention modules.
num_heads: 8

# Dimension of the VLA backbone's token embeddings (PaliGemma = 2048).
vlm_hidden_dim: 2048

# Per-modality branches. Each branch only needs its raw input dimension;
# the physics tokenizer handles projection to d_embedding internally.
# Current JAX wrapper wires only single-frame `ft_sensor` with shape (B, 12).
branches:
  ft_sensor:
    input_dim: 12

# Normally initialized output MLP that maps d_sidenet → action-expert hidden width.
output_mlp:
  hidden_features: 1024
  # Must match the action-expert hidden size (gemma_300m width = 1024).
  out_features: 1024
